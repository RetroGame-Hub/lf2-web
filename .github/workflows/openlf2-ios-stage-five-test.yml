name: Package the iOS Stage 5 sprite test
on:
  push:
    branches: [openlf2-ios-online]
    paths: [.github/workflows/openlf2-ios-stage-five-test.yml]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE: https://github.com/RetroGame-Hub/lf2-web/releases/download/ultimate-lf2-ios-friend-rooms-45970422869-1
      IPA: Ultimate-LF2-Online-iOS-arm64-unsigned.ipa
    steps:
      - name: Download and verify the current iOS test build
        run: |
          curl -fsSL --retry 3 --max-time 120 "$SOURCE/$IPA" -o "$IPA"
          printf '%s  %s\n' c23301f67b233779afbc310a28f5ac1a2516a6b490af8d7844f22ece270f0cae "$IPA" | sha256sum -c -
      - name: Preserve the original sprite pixels and pad the missing rows
        run: |
          mkdir -p artifacts
          python3 - "$IPA" "artifacts/$IPA" <<'PY'
          import plistlib
          import struct
          import sys
          from zipfile import ZipFile

          app = 'Payload/openlf2.app/'
          assets = app + 'scripts/data-override/sprite/sys/'
          heights = {
              assets + 'justin_1.bmp': (290, 559),
              assets + 'justin_1b.bmp': (290, 559),
              assets + 'knight_2.bmp': (250, 499),
              assets + 'bat_1.bmp': (350, 559),
          }

          def pad(bitmap, old_height, height):
              offset = struct.unpack_from('<I', bitmap, 10)[0]
              assert bitmap[:2] == b'BM' and struct.unpack_from('<I', bitmap, 14)[0] == 40
              assert struct.unpack_from('<iiHHI', bitmap, 18) == (800, old_height, 1, 8, 0)
              assert bitmap[54:58] == bytes(4) and bitmap[offset + 800 * old_height:] == bytes(2)
              # Positive BMP height means bottom-up. Prefix transparent rows to preserve the top-left.
              header = bytearray(bitmap[:offset])
              struct.pack_into('<I', header, 2, offset + 800 * height + 2)
              struct.pack_into('<i', header, 22, height)
              struct.pack_into('<I', header, 34, 800 * height)
              return bytes(header) + bytes(800 * (height - old_height)) + bitmap[offset:]

          source, output = sys.argv[1:]
          with ZipFile(source) as original, ZipFile(output, 'w') as modified:
              assert plistlib.loads(original.read(app + 'Info.plist'))['CFBundleIdentifier'] == 'io.github.retrogamehub.lf2ultimate.network'
              assert heights.keys() <= set(original.namelist())
              for entry in original.infolist():
                  payload = original.read(entry)
                  if entry.filename in heights:
                      payload = pad(payload, *heights[entry.filename])
                  modified.writestr(entry, payload)

          with ZipFile(source) as original, ZipFile(output) as modified:
              assert modified.testzip() is None
              assert modified.namelist() == original.namelist()
              changed = {name for name in original.namelist() if original.read(name) != modified.read(name)}
              assert changed == heights.keys()
              for name, (old_height, height) in heights.items():
                  old, new = original.read(name), modified.read(name)
                  off = struct.unpack_from('<I', new, 10)[0]
                  assert len(new) == off + 800 * height + 2
                  assert new[off:off + 800 * (height - old_height)] == bytes(800 * (height - old_height))
                  assert old[off:] == new[off + 800 * (height - old_height):]
          PY
          (cd artifacts && sha256sum "$IPA" > "$IPA.sha256")
      - name: Publish the separate unsigned Stage 5 test IPA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "ultimate-lf2-ios-stage-five-test-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" artifacts/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "終極 LF2 iOS｜第 5 關畫格修補測試" \
            --notes "Pads undersized Justin, Knight, and Bat sprite sheets for the Stage 5 crash investigation. S-David's ice attack remains intact. Unsigned ARM64 IPA. Reproduction on a physical iPhone is pending."
