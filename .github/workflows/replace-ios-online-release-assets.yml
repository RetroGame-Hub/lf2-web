name: Replace old iOS online release attachments
on:
  push:
    branches: [openlf2-ios-online]
    paths: [.github/workflows/replace-ios-online-release-assets.yml]

permissions:
  contents: write

concurrency: replace-old-ios-online-release-assets

jobs:
  replace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Verify and replace the two existing attachments
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess

          old = 'ultimate-lf2-ios-friend-rooms-45927582249-1'
          new = 'ultimate-lf2-ios-friend-rooms-45970422869-1'
          ipa = 'Ultimate-LF2-Online-iOS-arm64-unsigned.ipa'
          names = (ipa, ipa + '.sha256')
          expected = (
              'c23301f67b233779afbc310a28f5ac1a2516a6b490af8d7844f22ece270f0cae',
              '7d1d005c6e577781f908ccdc30f4d5b8738bf5c414b1cc7fc165b9136ac1f3c1',
          )

          def gh(*args):
              return subprocess.check_output(['gh', *args], text=True)

          def release():
              return json.loads(gh('api', 'repos/' + os.environ['GH_REPO'] + '/releases/tags/' + old))

          def assets():
              return {asset['name']: asset for asset in release()['assets']}

          repository = os.environ['GH_REPO']

          def rename(asset, name):
              gh('api', '--method', 'PATCH', f'repos/{repository}/releases/assets/{asset}', '-f', 'name=' + name)

          def delete(asset):
              gh('api', '--method', 'DELETE', f'repos/{repository}/releases/assets/{asset}')

          previous = release()
          assert previous['id'] == 460090127 and not previous['immutable']
          originals = dict(zip(names, (798591075, 798591069)))
          current = assets()
          assert all(current[name]['id'] == asset for name, asset in originals.items())

          gh('release', 'download', new, '-p', ipa, '-p', ipa + '.sha256')
          assert Path(names[1]).read_text().split() == [expected[0], ipa]
          for name, digest in zip(names, expected):
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == digest, name

          suffix = os.environ['GITHUB_RUN_ID']
          staged = {name: 'incoming-' + suffix + '-' + name for name in names}
          backups = {name: 'previous-' + suffix + '-' + name for name in names}
          for name, staging in staged.items():
              Path(name).rename(staging)
          gh('release', 'upload', old, *staged.values())
          uploaded = assets()
          replacements = {name: uploaded[staged[name]]['id'] for name in names}
          moved_old, moved_new = [], []
          try:
              for name in names:
                  rename(originals[name], backups[name])
                  moved_old.append(name)
              for name in names:
                  rename(replacements[name], name)
                  moved_new.append(name)
              verified = assets()
              for name, digest in zip(names, expected):
                  assert verified[name]['id'] == replacements[name]
                  assert verified[name]['digest'] == 'sha256:' + digest
          except Exception:
              for name in reversed(moved_new):
                  rename(replacements[name], staged[name])
              for name in reversed(moved_old):
                  rename(originals[name], name)
              raise
          for asset in originals.values():
              delete(asset)
          print('Verified both replacement attachments at their original names.')
          PY
