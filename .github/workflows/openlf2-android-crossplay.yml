name: Publish Ultimate LF2 Android cross-platform test APK
on:
  push:
    branches: [openlf2-android-prep]
    paths: [.github/workflows/openlf2-android-crossplay.yml, android-port/repack_crossplay.py]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      ANDROID_SOURCE: https://github.com/RetroGame-Hub/lf2-web/releases/download/ultimate-lf2-android-arm64-45950828624-1/Ultimate-LF2-Android-arm64.apk
      IOS_SOURCE: https://github.com/RetroGame-Hub/lf2-web/releases/download/ultimate-lf2-ios-friend-rooms-45970422869-1/Ultimate-LF2-Online-iOS-arm64-unsigned.ipa
    steps:
      - uses: actions/checkout@v4
      - name: Download the pinned Android and iOS releases
        run: |
          curl -fsSL --retry 3 --max-time 120 "$ANDROID_SOURCE" -o baseline.apk
          curl -fsSL --retry 3 --max-time 120 "$IOS_SOURCE" -o source.ipa
      - name: Refresh the game scripts with the existing Android engine
        run: python3 android-port/repack_crossplay.py package baseline.apk source.ipa unsigned.apk
      - name: Sign with the existing upstream test certificate
        run: |
          git clone --depth 1 --branch v1.2.0 https://github.com/OpenLF2/OpenLF2.git upstream
          test "$(git -C upstream rev-parse HEAD)" = 6942db7cfaddf2e65eb45e4a4d4632120dc968f7
          tools="$ANDROID_HOME/build-tools/35.0.0"
          if [[ ! -x "$tools/apksigner" ]]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;35.0.0'
          fi
          mkdir -p artifacts
          apk=artifacts/Ultimate-LF2-Android-arm64.apk
          "$tools/zipalign" -P 16 -f 4 unsigned.apk aligned.apk
          "$tools/apksigner" sign --ks upstream/android/debug.keystore --ks-type PKCS12 --ks-key-alias openlf2 \
            --ks-pass pass:android --key-pass pass:android --v1-signer-name CERT --v4-signing-enabled false --out "$apk" aligned.apk
          "$tools/zipalign" -c -P 16 4 "$apk"
          "$tools/apksigner" verify --verbose --print-certs "$apk" | tee apk-signing.txt
          grep -Fx 'Signer #1 certificate SHA-256 digest: 63cf25a7fa57c0a64b9fdce16e9913fc75563e6af27b6d497a39be5ed3da9a11' apk-signing.txt
          "$tools/aapt" dump badging "$apk" > apk-badging.txt
          grep -F "package: name='io.github.retrogamehub.lf2ultimate.network' versionCode='12'" apk-badging.txt
          grep -Fx "native-code: 'arm64-v8a'" apk-badging.txt
          python3 android-port/repack_crossplay.py verify baseline.apk source.ipa "$apk"
          (cd artifacts && sha256sum Ultimate-LF2-Android-arm64.apk > Ultimate-LF2-Android-arm64.apk.sha256)
      - name: Preserve rollback copy of the previous APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK-before-crossplay-update
          path: baseline.apk
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
      - name: Replace validated attachments at the original download URLs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess

          tag = 'ultimate-lf2-android-arm64-45950828624-1'
          apk = 'Ultimate-LF2-Android-arm64.apk'
          names = (apk, apk + '.sha256')
          originals = dict(zip(names, (799240756, 799240764)))
          repo = os.environ['GH_REPO']
          run_id = os.environ['GITHUB_RUN_ID']

          def gh(*args):
              return subprocess.check_output(['gh', *args], text=True)

          def release():
              return json.loads(gh('api', f'repos/{repo}/releases/tags/{tag}'))

          def asset_operation(method, asset, *args):
              gh('api', '--method', method, f'repos/{repo}/releases/assets/{asset}', *args)

          def rename(asset, name):
              asset_operation('PATCH', asset, '-f', 'name=' + name)

          def assets(release):
              return {asset['name']: asset for asset in release['assets']}

          initial = release()
          assert initial['id'] == 460232341 and not initial['immutable']
          assert {name: asset['id'] for name, asset in assets(initial).items()} == originals

          incoming = {name: f'incoming-{run_id}-{name}' for name in names}
          backups = {name: f'previous-{run_id}-{name}' for name in names}
          staged = {name: Path('artifacts', temporary) for name, temporary in incoming.items()}
          expected = {}
          for name, path in staged.items():
              Path('artifacts', name).rename(path)
              with path.open('rb') as data:
                  expected[name] = 'sha256:' + hashlib.file_digest(data, 'sha256').hexdigest()

          gh('release', 'upload', tag, *(str(path) for path in staged.values()))
          uploaded = assets(release())
          replacements = {name: uploaded[incoming[name]]['id'] for name in names}
          assert all(uploaded[incoming[name]]['digest'] == expected[name] for name in names)
          moved_old, moved_new = [], []
          try:
              for name in names:
                  rename(originals[name], backups[name])
                  moved_old.append(name)
              for name in names:
                  rename(replacements[name], name)
                  moved_new.append(name)
              verified = assets(release())
              for name in names:
                  assert verified[name]['id'] == replacements[name]
                  assert verified[name]['digest'] == expected[name]
          except Exception:
              for name in reversed(moved_new):
                  rename(replacements[name], incoming[name])
              for name in reversed(moved_old):
                  rename(originals[name], name)
              raise
          for asset in originals.values():
              asset_operation('DELETE', asset)
          assert set(assets(release())) == set(names)
          print('The Android APK and checksum now use the original download URLs.')
          PY
